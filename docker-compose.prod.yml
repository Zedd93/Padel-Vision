# Produkcja na droplecie DigitalOcean: backend + baza + cache + HTTPS.
# Frontend działa na Vercelu — tutaj go nie ma.
# Wdrażane przez .github/workflows/deploy.yml, instrukcja: docs/DEPLOY.md

services:
  # ─── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-padelvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-padelvision}
    volumes:
      - /mnt/storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-padelvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - /mnt/storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  # ─── Backend (Spring Boot) ──────────────────────────
  backend:
    image: ghcr.io/zedd93/padelvision-backend:latest
    restart: always
    # Tylko localhost — z internetu backend jest osiągalny wyłącznie przez Caddy.
    # Port zostaje na hoście do debugowania: curl localhost:4000/api/health
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env.production
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-padelvision}
      DATABASE_USERNAME: ${POSTGRES_USER:-padelvision}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Caddy (HTTPS + reverse proxy) ───────────────────
  # Sam pobiera i odnawia certyfikat Let's Encrypt dla API_DOMAIN.
  # Wymaga rekordu DNS A: API_DOMAIN → IP dropletu.
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  # Certyfikaty TLS — muszą przetrwać restart, inaczej Let's Encrypt
  # szybko zablokuje wydawanie nowych (limity)
  caddy_data:
  caddy_config:
