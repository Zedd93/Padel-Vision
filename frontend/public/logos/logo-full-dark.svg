<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- 2B FILLED LENS — DARK variant -->
  <defs>
    <linearGradient id="lg2bd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8FF00"/><stop offset="100%" stop-color="#A0D900"/>
    </linearGradient>
  </defs>
  <g transform="translate(22, 30)">
    <!-- Filled racket head -->
    <rect x="-16" y="-20" width="32" height="32" rx="9" fill="url(#lg2bd)"/>
    <!-- Dark grid lines -->
    <line x1="-5" y1="-20" x2="-5" y2="12" stroke="#0B0C10" stroke-width="0.9" opacity="0.2"/>
    <line x1="5" y1="-20" x2="5" y2="12" stroke="#0B0C10" stroke-width="0.9" opacity="0.2"/>
    <line x1="-16" y1="-7" x2="16" y2="-7" stroke="#0B0C10" stroke-width="0.9" opacity="0.2"/>
    <line x1="-16" y1="4" x2="16" y2="4" stroke="#0B0C10" stroke-width="0.9" opacity="0.2"/>
    <!-- Center lens circle -->
    <circle cx="0" cy="-4" r="7" fill="#0B0C10" opacity="0.35"/>
    <circle cx="0" cy="-4" r="2.8" fill="#0B0C10" opacity="0.5"/>
    <!-- Handle -->
    <rect x="-4" y="12" width="8" height="12" rx="3" fill="url(#lg2bd)"/>
    <line x1="0" y1="13" x2="0" y2="23" stroke="#0B0C10" stroke-width="0.7" opacity="0.15"/>
  </g>
  <text x="48" y="24" font-family="Bebas Neue, sans-serif" font-size="22" fill="#C8FF00" letter-spacing="3">PADEL</text>
  <text x="48" y="46" font-family="Bebas Neue, sans-serif" font-size="22" fill="#FFFFFF" letter-spacing="3">VISION</text>
</svg>
