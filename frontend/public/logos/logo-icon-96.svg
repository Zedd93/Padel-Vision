<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- 2B FILLED LENS — App Icon 96px -->
  <rect width="96" height="96" rx="22" fill="#0B0C10"/>
  <defs>
    <linearGradient id="ai2b96" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8FF00"/><stop offset="100%" stop-color="#A0D900"/>
    </linearGradient>
    <filter id="g2b96"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#g2b96)">
    <!-- Filled racket head -->
    <rect x="22" y="12" width="52" height="52" rx="15" fill="url(#ai2b96)"/>
    <!-- Dark grid lines carved in -->
    <line x1="38" y1="12" x2="38" y2="64" stroke="#0B0C10" stroke-width="1.2" opacity="0.2"/>
    <line x1="58" y1="12" x2="58" y2="64" stroke="#0B0C10" stroke-width="1.2" opacity="0.2"/>
    <line x1="22" y1="30" x2="74" y2="30" stroke="#0B0C10" stroke-width="1.2" opacity="0.2"/>
    <line x1="22" y1="48" x2="74" y2="48" stroke="#0B0C10" stroke-width="1.2" opacity="0.2"/>
    <!-- Center lens circle -->
    <circle cx="48" cy="36" r="12" fill="#0B0C10" opacity="0.35"/>
    <circle cx="48" cy="36" r="5" fill="#0B0C10" opacity="0.5"/>
    <!-- Handle -->
    <rect x="42" y="64" width="12" height="18" rx="4" fill="url(#ai2b96)"/>
    <line x1="48" y1="65" x2="48" y2="81" stroke="#0B0C10" stroke-width="1" opacity="0.15"/>
  </g>
</svg>
