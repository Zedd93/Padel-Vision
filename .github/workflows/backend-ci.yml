name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: padelvision_test
          POSTGRES_USER: padelvision
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/padelvision_test
          DATABASE_USERNAME: padelvision
          DATABASE_PASSWORD: testpass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-min-256-bit-key-for-hs512-algorithm
        run: ./mvnw clean verify -B

      - name: Build package
        working-directory: backend
        run: ./mvnw package -DskipTests -B

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          IMAGE_TAG: padelvision-backend
        run: docker build -t "$IMAGE_TAG:latest" .
