name: "Backend: Test"

on:
  workflow_call:

jobs:
  # ─── Maven unit + integration tests ─────────────────
  unit-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: padelvision_test
          POSTGRES_USER: padelvision
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/padelvision_test
          DATABASE_USERNAME: padelvision
          DATABASE_PASSWORD: testpass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-min-256-bit-key-for-hs512-algorithm
        run: mvn clean verify -B

  # ─── Insomnia smoke tests against running API ───────
  # Boots the backend jar, waits for /api/health, then runs the
  # `smoke` test suite from backend/insomnia/padelvision.insomnia.json
  api-test:
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: padelvision_test
          POSTGRES_USER: padelvision
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend jar
        working-directory: backend
        run: mvn package -DskipTests -B

      - name: Start backend in background
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATABASE_URL: jdbc:postgresql://localhost:5432/padelvision_test
          DATABASE_USERNAME: padelvision
          DATABASE_PASSWORD: testpass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-min-256-bit-key-for-hs512-algorithm
          SERVER_PORT: 8080
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          nohup java -jar target/*.jar > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Started backend with PID $(cat backend.pid)"

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Backend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start within 60s"
          tail -100 backend/backend.log || true
          exit 1

      # Binarka z releasów Kong/insomnia zamiast npm: pakiet insomnia-inso
      # zatrzymał się na 3.6.0 i ciągnie natywny node-libcurl, dla którego
      # nie ma już prebuiltów pod aktualne ABI Node'a.
      - name: Install Inso CLI
        env:
          INSO_VERSION: "13.2.0"
        run: |
          curl -fsSL -o /tmp/inso.tar.xz \
            "https://github.com/Kong/insomnia/releases/download/core%40${INSO_VERSION}/inso-linux-x64-${INSO_VERSION}.tar.xz"
          mkdir -p /tmp/inso && tar -xJf /tmp/inso.tar.xz -C /tmp/inso
          find /tmp/inso -maxdepth 2 -name inso -type f -exec chmod +x {} \; -exec dirname {} \; \
            | head -1 >> "$GITHUB_PATH"

      # inso 13 nie ma juz --src: sciezke do eksportu podaje sie w --workingDir.
      - name: Run Insomnia smoke suite
        working-directory: backend
        run: |
          inso run test smoke \
            --workingDir insomnia/padelvision.insomnia.json \
            --env CI \
            --reporter spec \
            --ci

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill "$(cat backend/backend.pid)" 2>/dev/null || true
          fi
