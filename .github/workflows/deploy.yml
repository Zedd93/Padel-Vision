name: "Deploy to DigitalOcean"

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          echo "Fetching production secrets from AWS SM..."
          SECRETS=$(aws secretsmanager get-secret-value \
            --secret-id padelvision/prod \
            --query 'SecretString' \
            --output text)

          # Generate .env.production from JSON
          echo "$SECRETS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for k, v in data.items():
              if not k.startswith('#'):
                  print(f'{k}={v}')
          " > .env.production

          # Extract deploy-specific values into step outputs
          echo "do_host=$(echo "$SECRETS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('DIGITALOCEAN_HOST',''))")" >> "$GITHUB_OUTPUT"
          echo "do_user=$(echo "$SECRETS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('DIGITALOCEAN_USERNAME','root'))")" >> "$GITHUB_OUTPUT"
          echo "ghcr_token=$(echo "$SECRETS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('GHCR_TOKEN',''))")" >> "$GITHUB_OUTPUT"

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.secrets.outputs.do_host }}
          username: ${{ steps.secrets.outputs.do_user }}
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          source: "docker-compose.prod.yml,.env.production"
          target: /opt/padelvision/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ steps.secrets.outputs.ghcr_token }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ steps.secrets.outputs.do_host }}
          username: ${{ steps.secrets.outputs.do_user }}
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          envs: DEPLOY_SHA,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd /opt/padelvision
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            echo "Waiting for services..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
            echo "Deploy complete: $DEPLOY_SHA"
