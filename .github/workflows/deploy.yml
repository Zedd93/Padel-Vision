name: "Deploy na serwer firmowy"

# Backend jako usluga Windows na serwerze firmowym.
#
# Serwer stoi za NAT-em i nie przyjmuje polaczen z internetu, wiec GitHub
# nie moze sie do niego zalogowac. Zamiast tego na serwerze dziala
# self-hosted runner GitHub Actions: sam laczy sie z GitHubem (ruch
# wychodzacy), odbiera to zadanie i wykonuje je lokalnie.
#
# Konfiguracja produkcyjna (hasla, klucze) zyje wylacznie na serwerze
# w C:\padelvision\.env.production - w GitHubie nie ma zadnych sekretow.
#
# Instrukcja: docs/DEPLOY.md

on:
  workflow_call:

jobs:
  deploy:
    # Etykieta nadawana przy instalacji runnera - tylko ten job trafia na serwer
    runs-on: [self-hosted, windows, padelvision-prod]
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: artifact

      # -ExecutionPolicy Bypass: firmowe GPO moga blokowac niepodpisane skrypty
      - name: Deploy
        shell: powershell
        run: |
          $jar = Get-ChildItem artifact -Filter *.jar | Select-Object -First 1
          if (-not $jar) { throw 'Brak pliku JAR w artefakcie backend-jar' }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\deploy\windows\deploy.ps1 -JarPath $jar.FullName
          exit $LASTEXITCODE
