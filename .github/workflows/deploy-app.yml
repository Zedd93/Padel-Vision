name: "Deploy App"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Build and publish Docker images to GHCR"
        type: boolean
        default: true
      deploy:
        description: "Deploy backendu na serwer firmowy"
        type: boolean
        default: false

jobs:
  # ─── Frontend Pipeline ─────────────────────────────
  frontend-lint:
    uses: ./.github/workflows/frontend-lint.yml

  frontend-test:
    needs: frontend-lint
    uses: ./.github/workflows/frontend-test.yml

  frontend-build:
    needs: frontend-test
    uses: ./.github/workflows/frontend-build.yml

  # ─── Backend Pipeline (parallel with frontend) ─────
  backend-test:
    uses: ./.github/workflows/backend-test.yml

  backend-build:
    needs: backend-test
    uses: ./.github/workflows/backend-build.yml

  # ─── Docker Publish ─────────────────────────────────
  # Runs on:
  #   - push to main (automatic on every merge)
  #   - manual workflow_dispatch when "publish_images" is true
  docker-publish:
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_images)
    needs: [frontend-build, backend-build]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write

  # ─── Deploy na serwer firmowy ───────────────────────
  # Runs on:
  #   - push to main (automatic, after backend tests and build pass)
  #   - manual workflow_dispatch when "deploy" is true
  # Nie zalezy od docker-publish: serwer uruchamia JAR z artefaktu
  # backend-jar, a nie obraz Dockera (WSL1 nie obsluguje Dockera).
  deploy:
    needs: backend-build
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
