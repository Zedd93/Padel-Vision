services:
  # ─── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: padelvision
      POSTGRES_USER: padelvision
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padelvision"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - padelvision-network

  # ─── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - padelvision-network

  # ─── Backend (Spring Boot) ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pv-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/padelvision
      DATABASE_USERNAME: padelvision
      DATABASE_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # HS512 wymaga klucza >= 512 bitow (64 znakow) - krotszy wywala rejestracje
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-for-hs512-which-needs-at-least-512-bits-of-entropy-padelvision}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # YouTube Live - setup: docs/YOUTUBE_SETUP.md, test: docs/YOUTUBE_TEST.md
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-http://localhost:8080/api/club/youtube/callback}
      YOUTUBE_TOKEN_ENC_KEY: ${YOUTUBE_TOKEN_ENC_KEY:-}
      YOUTUBE_DEFAULT_PRIVACY: ${YOUTUBE_DEFAULT_PRIVACY:-unlisted}
      YOUTUBE_DEFAULT_LATENCY: ${YOUTUBE_DEFAULT_LATENCY:-low}
      YOUTUBE_POST_CONNECT_REDIRECT: ${YOUTUBE_POST_CONNECT_REDIRECT:-http://localhost:5173/studio}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - padelvision-network

  # ─── Frontend (React + nginx) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pv-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - padelvision-network

volumes:
  postgres-data:
  redis-data:

networks:
  padelvision-network:
    driver: bridge
